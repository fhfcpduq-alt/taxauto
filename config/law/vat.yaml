    note: "제2항 미발급·지연발급 가산세가 적용되는 부분에는 전송 가산세·합계표 가산세 중복 적용 안 함."
penalty.ti_late_receipt:
  - value: 0.005
    source: "부가가치세법 제60조 제7항 제1호, 시행령 제108조(제75조 제3호·제7호·제8호) (https://www.law.go.kr/법령/부가가치세법/제60조)"
    verified: true
    checked_on: 2026-10-02
    verify_method: search_excerpt
    note: >-
      지연수취 = 공급시기 이후 발급받았으나 매입세액 공제가 허용되는 경우에만 0.5% 부과.
      (1) 공급시기 후 발급분으로 그 공급시기가 속하는 과세기간의 확정신고기한까지 발급받은 경우 → 해당 과세기간에 공제(시행령 제75조 제3호).
      (2) 확정신고기한이 지난 후 발급받았더라도 발급일이 확정신고기한 다음 날부터 1년 이내이고
          수정신고·경정청구 또는 과세관청 결정·경정으로 공제받는 경우(제75조 제7호; 2022.2.15 개정으로 6개월→1년).
      (3) 그 밖에 제75조 제8호(공급시기 전 발급 특례 범위 밖) 등.
      위 범위를 벗어나면(확정신고기한 다음 날부터 1년 초과) 매입세액 불공제 → 가산세가 아니라 불공제로 처리.
