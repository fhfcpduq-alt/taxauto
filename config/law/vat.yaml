# 간이과세자 중 영수증 발급 대상(세금계산서 발급 불가) 기준
simple_taxpayer.card_receipt_only_threshold:
  - value: 48000000
    source: "부가가치세법 제36조 제1항 제2호, 제36조의2, 제46조 제3항, 시행령 제88조 제5항 (https://www.law.go.kr/법령/부가가치세법/제36조)"
    verified: true
    checked_on: 2026-10-02
    verify_method: search_excerpt
    note: >-
      직전연도 공급대가(부가세 포함) 합계 4,800만원 '미만' 간이과세자와 신규 간이과세자(최초 과세기간)는 영수증 발급 대상.
      이들로부터 받은 신용카드매출전표·현금영수증은 매입세액공제 불가(제46조 제3항 '대통령령으로 정하는 사업자'에서 제외).
      적용기간 전환은 해당 연도 다음 해 7.1부터(제36조의2). 4,800만원 이상 간이과세자 가맹점은 세금계산서 발급 의무 → 카드매입 공제 가능.

# 신용카드매출전표 등 수취분 매입세액공제가 안 되는 공급자 업종(본래 사업 관련 공급분)
card_purchase.non_deductible_industries:
  - value:
      - "목욕·이발·미용업"
      - "여객운송업(전세버스운송사업 제외) — 택시·버스·항공·KTX 등"
      - "입장권을 발행하여 경영하는 사업(공연장·놀이시설 등)"
      - "과세되는 쌍꺼풀수술 등 성형 진료용역(시행령 제35조 제1호 단서)"
      - "수의사의 과세되는 동물진료용역(시행령 제35조 제2호 단서)"
      - "무도학원·자동차운전학원(시행령 제36조 제2항 제1호·제2호)"
      - "간이과세자 중 영수증 발급 대상자(법 제36조 제1항 제2호: 직전연도 공급대가 4,800만원 미만·신규)"
    source: "부가가치세법 제46조 제3항, 시행령 제88조 제5항(제73조 제1항·제2항 준용) (https://www.law.go.kr/법령/부가가치세법시행령/제88조), 국세청 사업용 신용카드 안내 (https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2475&cntntsId=7799)"
    verified: true
    checked_on: 2026-10-02
    verify_method: search_excerpt
    note: >-
      이 목록은 '세금계산서를 발급할 수 없는' 업종이라 카드매입 공제가 막히는 것. 별도로 일반 불공제 사유(제39조:
      사업무관, 비영업용 소형승용차, 접대비, 면세사업 관련 등)는 업종과 무관하게 적용됨. 부가세 별도 구분 기재 요건 + 매입처별 명세서 제출 필요.

# 매입세액 공제 가능한 차량(제39조 제1항 제5호 불공제 대상이 아닌 것)
passenger_car.deductible_types:
  - value:
      - "경형 승용차(배기량 1,000cc 이하로 개별소비세 과세대상에서 제외되는 경차; 길이·폭 기준은 개소세법 시행령)"
      - "정원 9인승 이상 승용·승합차"
      - "화물자동차(밴 등 화물칸 구조 차량 포함)"
      - "배기량 125cc 이하 이륜자동차"
      - "운수업·자동차판매업·자동차임대업·운전학원업·경비업(출동차량) 등 시행령 제19조/제78조의 업종에서 영업에 직접 사용하는 승용차"
    source: "부가가치세법 제39조 제1항 제5호, 개별소비세법 제1조 제2항 제3호, 부가가치세법 시행령 제78조 (https://www.law.go.kr/법령/부가가치세법/제39조)"
    verified: false
    checked_on: 2026-10-02
    note: >-
      핵심 원칙(개소세 과세대상인 8인승 이하 승용차는 구입·임차·유지 매입세액 불공제, 1,000cc 이하 경차·9인승 이상·화물차는 공제)은 확인.
      다만 경차 길이·폭 요건, 이륜차 125cc 기준, 캠핑용 자동차·전기승용차 취급, 영업용 업종 세부 목록은 원문 미열람 → 미확정.
      차종 판정은 등록증 차종/정원 기준으로 사람 검토 권장.

