# 부가가치세 세법 파라미터 (값은 데이터, 코드는 키만 참조)
# 규칙
#  - 키 이름은 코드와의 계약이므로 바꾸지 말 것(추가만).
#  - 개정되면 기존 항목의 to: 를 닫고 새 버전을 아래에 추가.
#  - verified: true 는 법령/국세청 자료로 직접 확인한 경우에만. checked_on 필수.
#  - 이 파일은 세법검증 섹터가 근거를 확인해 갱신한다. 초기값은 설계자 기억값(verified: false).
#
# 2026-10-02 세법검증 섹터 검증 메모
#  - 작업 환경의 네트워크 정책상 law.go.kr / nts.go.kr 원문 페이지 직접 열람(WebFetch)이 차단됨.
#    검색엔진(WebSearch)이 law.go.kr·nts.go.kr·korea.kr 및 회계법인/세정신문 자료에서 발췌한 조문 문언으로 확인함.
#    → verify_method: search_excerpt 로 표시. 12월 개정세법 반영 시 원문 페이지로 재확인 권장.
#  - 부가적인 필드(checked_on, note, verify_method, description)는 law.py 가 무시한다(값 조회에 영향 없음).
#  - '_' 로 시작하는 키는 law.py 가 로딩하지 않는다 → 국회 미통과 개정안은 _pending_* 에 메모로만 둔다.

