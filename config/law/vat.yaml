card_issue_credit.cap_to_payable:
  - value: true
    description: >-
      공제받는 금액이 그 금액을 차감하기 전의 납부할 세액을 초과하면 그 초과하는 부분은 없는 것으로 본다
      (환급 불가). 납부할 세액 = 납부세액 ± 부가법·국기법·조특법상 빼거나 더할 세액(가산세 제외),
      0보다 작으면 0. 예정고지세액·예정신고 미환급세액 차감 전 단계에서 비교.
    source: "부가가치세법 제46조 제2항 (https://www.law.go.kr/법령/부가가치세법/제46조)"
    verified: true
    checked_on: 2026-10-02
    verify_method: search_excerpt

