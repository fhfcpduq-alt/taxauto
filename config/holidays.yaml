# 국세 기한 계산용 공휴일(대체공휴일·임시공휴일 포함). 토·일은 코드에서 자동 처리.
# 매년 12월에 다음 해 목록 추가. (세법검증 섹터가 확인)
#
# 근거: 국세기본법 제5조 제1항 — 기한이 1. 토요일·일요일 2. 「공휴일에 관한 법률」에 따른 공휴일 및 대체공휴일
#       3. 「근로자의 날 제정에 관한 법률」에 따른 근로자의 날 에 해당하면 그 다음 날이 기한.
#       → 5월 1일은 국기법 제5조 제3호로 원래 기한연장 사유였고, 2026년부터는 '노동절'로 명칭 변경(2025.11 법 개정)
#         + 공휴일법 개정(2026.3.31 국회 통과, 2026.4.6 국무회의 의결)으로 법정 공휴일이 됨. 대체공휴일 대상.
#       → 제헌절(7.17)은 공휴일법·관공서 공휴일 규정 개정(2026.5.11 시행)으로 2026년부터 공휴일 재지정. 대체공휴일 대상.
#       → 현충일은 대체공휴일 미적용. 설·추석 연휴는 '일요일 또는 다른 공휴일'과 겹칠 때만 대체(토요일 겹침은 대체 없음).
# 확인: 2026-10-02, 우주항공청 '2027년 월력요항'(2026.6.29 발표) 및 언론·정부(korea.kr) 보도 검색 발췌.
