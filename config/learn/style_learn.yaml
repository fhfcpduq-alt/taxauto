# 세무사 전표 스타일 학습 설정 (taxauto.learn.features / miner / classify.account)
# 숫자·목록은 사무실 기준이므로 자유롭게 조정한다(세법 값 아님).

version: 1

# ---------------------------------------------------------------------------
# 상호 정규화
# ---------------------------------------------------------------------------
names:
  # 대표 브랜드(앞부분이 이것이면 나머지 지점명을 버림). 정규화 후(공백·기호 제거, 소문자) 비교.
  brands: [이마트, 이마트24, 홈플러스, 롯데마트, 코스트코, 트레이더스, 하나로마트, 노브랜드, 식자재왕, 다이소, 쿠팡, 스타벅스, 이디야,
           투썸플레이스, 메가커피, 맥도날드, 롯데리아, 버거킹, gs25, cu, 세븐일레븐, 미니스톱, 올리브영, 교보문고, 오피스디포,
           sk에너지, gs칼텍스, s-oil, 에쓰오일, 현대오일뱅크, 알뜰주유소, 한국전력, kt, skt, lgu+, 하이패스, 한국도로공사]
  # 같은 브랜드의 다른 표기(앞부분 일치) → 대표 브랜드
  brand_aliases:
    sk에너지: [에스케이에너지, sk주유소]
    gs칼텍스: [지에스칼텍스]
    s-oil: [에쓰오일, 에스오일]
    현대오일뱅크: [hd현대오일뱅크]
    이마트: [emart]
    홈플러스: [homeplus]
    쿠팡: [coupang]
  # '...점'으로 끝나도 지점명이 아닌 업종 단어(떼지 않음)
  branch_exceptions: [정육점, 할인점, 편의점, 백화점, 서점, 대리점, 판매점, 전문점, 음식점, 직영점, 본점, 문구점, 철물점, 반찬점, 도매점]
  # 공백 뒤 마지막 토큰이 이 패턴이면 지점으로 보고 버림
  branch_regex: "^[가-힣A-Za-z0-9]{1,12}(점|지점|직영점|센터점|역점|대리점)$"
  # 공용 규칙(업종팩)에서 빼는 '개인 이름처럼 보이는 상호': 한글 2~4자, 아래 업종 꼬리말 없음
  person_name_regex: "^[가-힣]{2,4}$"
  business_suffixes: [상회, 상사, 마트, 식당, 약국, 센터, 카페, 점, 사, 공사, 건설, 산업, 유통, 식품, 농산, 수산, 축산, 정육, 주유소, 문구, 철물, 기업, 전자]

# 가맹점업종이 없을 때 상호 키워드로 추정하는 업종(정규화 상호에 포함되면). 위에서부터 첫 매칭.
merchant_categories:
  주유소: [주유, 오일, 에너지, 칼텍스, s-oil, 에쓰오일, 오일뱅크, 충전소, lpg]
  골프장: [골프, cc, 컨트리클럽, 골프클럽]
  식자재: [식자재, 식재료, 농산, 수산, 축산, 정육, 청과, 야채]
  대형마트: [이마트, 홈플러스, 롯데마트, 코스트코, 트레이더스, 하나로마트, 노브랜드, 마트]
  편의점: [gs25, cu, 세븐일레븐, 미니스톱, 이마트24, 편의점]
  커피: [스타벅스, 이디야, 투썸, 메가커피, 커피, 카페]
  음식점: [식당, 국밥, 갈비, 고기, 치킨, 피자, 반점, 횟집, 한식, 분식, 맥도날드, 롯데리아, 버거킹]
  유흥: [노래, 주점, 클럽, 단란, 유흥, 룸]
  통신: [kt, skt, lgu+, 통신, 텔레콤]
  전기가스: [한국전력, 전력, 가스, 도시가스]
  통행료: [하이패스, 도로공사, 통행료]
  사무용품: [다이소, 오피스디포, 문구, 사무용품, 알파]
  온라인쇼핑: [쿠팡, 11번가, g마켓, 옥션, 네이버, 스마트스토어]
  철물자재: [철물, 공구, 자재, 건재]
  인쇄광고: [인쇄, 광고, 현수막, 간판]
  택배운송: [택배, 퀵, 용달, 화물, 운송]

# 홈택스 가맹점업종 문구 → 표준 업종(위 키). 포함 여부. 없으면 원문 그대로.
merchant_category_aliases:
  주유소: [주유소, 석유, 연료, 유류]
  골프장: [골프]
  식자재: [농축수산, 식료품, 정육, 수산물, 청과]
  대형마트: [대형할인점, 할인점, 슈퍼마켓]
  편의점: [편의점]
  커피: [커피, 다방, 휴게음식]
  음식점: [일반음식, 한식, 중식, 일식, 양식, 음식점]
  유흥: [유흥, 단란, 주점]

# 금액구간(공급가액 기준 하한, 원). 라벨은 '~3만' 처럼 표시.
amount_bands: [0, 30000, 100000, 500000, 1000000, 3000000, 10000000]

# ---------------------------------------------------------------------------
# 규칙 추출(miner)
# ---------------------------------------------------------------------------
miner:
  # 학습 대상 필드. by_doc_type: 문서종류(카드/세금계산서…)별로 따로 학습할 필드
  fields: [account, entry_type, nd_reason, settlement, summary, fixed_asset]
  by_doc_type: [entry_type, nd_reason, settlement]
  # 계층(위가 우선). scope: client=거래처 style.yaml / industry=업종팩 / all=전체팩
  levels:
    - {name: biz, scope: client, min_support: 2, min_consistency: 0.8}
    - {name: name, scope: client, min_support: 2, min_consistency: 0.8}
    - {name: group_name, scope: industry, min_support: 3, min_consistency: 0.8, min_clients: 2}
    - {name: group_mcat, scope: industry, min_support: 4, min_consistency: 0.75, min_clients: 2}
    - {name: all_mcat, scope: all, min_support: 6, min_consistency: 0.8, min_clients: 3}
  # 불일치 질문: 같은 거래처·가맹점에서 이만큼 이상 나왔는데 일관성 < min_consistency 이면 질문
  question_min_support: 3
  question_fields: [account, entry_type, nd_reason, settlement, fixed_asset]
  max_questions_per_client: 30
  # 적요 템플릿: 상호·품목·월을 자리표시자로 바꿔 최빈 패턴을 찾음
  summary_placeholders: ["{거래처명}", "{상호}", "{품목}", "{월}"]

# ---------------------------------------------------------------------------
# 적용(classify.account.apply_style)
# ---------------------------------------------------------------------------
apply:
  sales: true                     # 매출에도 스타일 필드 채움(category=일반매입·decided_by=default·note='매출-스타일전용' 껍데기)
  fewshot_k: 6                    # 거래 1건당 유사사례 수
  fewshot_batch: 30               # 1회 질의 거래 수
  fewshot_max_items: 200          # 1회 실행 최대 질의 거래 수
  fewshot_min_confidence: 0.7     # 이 미만이면 반영 안 함(비워둠)
  fewshot_effort: low             # 분류 작업이라 낮은 effort
