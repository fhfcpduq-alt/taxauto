# 레시피 형식 예시 — 실제 위하고 화면이 아니다(재생기가 status: example 은 실행 거부).
# 실제 레시피는 학습모드(wehago-learn)에서 에이전트가 Playwright MCP 응답의 role/name 을 보고 만든다.
# 아래 메뉴명·버튼명은 전부 '추정' 자리표시자다.

id: example_export_ledger
version: 1
status: example              # example | draft(학습 직후, 사람 확인 전) | active(야간 재생 대상) | broken(재생 실패, 수리 필요)
procedure: procedures/40_export_ledger.md
description: (예시) 매입매출 전표 목록을 엑셀로 내려받기
learned_at: null             # 학습 일시 (예: 2026-10-05T21:10:00+09:00)
learned_by: null             # wehago-learn / wehago-operator(자가수리)
requires: [client.name, period.code, filing.coverage_start, filing.coverage_end]
vars:
  menu_name: 매입매출전표입력   # (추정)
history: []                  # 수정 이력 [{at, by, change, reason}]  — 에이전트가 고칠 때마다 1줄 추가

steps:
  - id: open_menu
    action: click
    role: menuitem           # Playwright MCP 스냅샷에 보이는 role
    name: "${menu_name}"     # 스냅샷에 보이는 접근성 이름(화면 글자)
    timeout_ms: 15000
    note: (추정) 회계 > 전표입력 > 매입매출전표입력

  - id: set_from
    action: fill
    label: 조회기간 시작     # (추정)
    value: "${filing.coverage_start}"

  - id: set_to
    action: fill
    label: 조회기간 종료     # (추정)
    value: "${filing.coverage_end}"

  - id: search
    action: click
    role: button
    name: 조회
    exact: true
    checkpoint: true

  - id: loaded
    action: expect_text
    text: "${client.name}"   # 화면 상단 회사명으로 회사가 맞는지 확인

  - id: download
    action: download
    role: button
    name: 엑셀                # (추정) 내보내기/엑셀 다운로드
    save_as: "ledger_${client.id}_${period.code}.xlsx"
    checkpoint: true
